  - id: H-10
    title: Standard deviation (s) control chart on Fridge Detail
    points: "tool depth: a third control chart, so dispersion has its own chart instead of being implied by the range chart"
    status: done
    owner: "agent"
    started_at: "2026-10-18"
    owns: ["SPEC.md", "app/R/", "app/app.R", "app/manifest.json", "tests/"]
    notes: >
      The app charts hourly means (X-bar) and hourly ranges, and estimates sigma
      from the within-subgroup variances to draw both sets of limits, but it has
      no chart of the subgroup standard deviations themselves. Add one, on the
      same shape as the range chart: same test 1 only, same frozen baseline, same
      strict comparisons (a point exactly on a line is never a flag).
      The constants are COMPUTED, not looked up, matching range_constants.R:
      c4 = sqrt(2/(n-1)) * Gamma(n/2) / Gamma((n-1)/2), which gives E[s] = c4*sigma
      and sd(s) = sigma*sqrt(1-c4^2). Limits are c4*sigma_short +/- 3 sd(s), with
      the lower limit held at 0 because an sd cannot be negative. sigma_short is
      the pooled within-subgroup estimate freeze_baseline already computes.
      DISPLAY ONLY, like the blood types: s-chart flags must NOT feed the badge,
      the RPN, units_at_risk or the violations table. The range chart already
      carries dispersion into those numbers, so a second dispersion signal would
      double-count the same physical variation and move every published number.
    definition_of_done: >
      A test computes c4, B5 and B6 from the closed form
      c4 = sqrt(2/(n-1)) * Gamma(n/2) / Gamma((n-1)/2), B5 = max(0, c4 - 3*sqrt(1-c4^2)),
      B6 = c4 + 3*sqrt(1-c4^2), and asserts the results against values derived
      independently for n = 4 (c4 = 0.9213177, B6 = 2.0877494, B5 = 0) and n = 2
      (c4 = 0.7978846, B6 = 2.6063154, B5 = 0); the test then cross-checks that
      those computed values reproduce the standard textbook table to four
      decimals, so the formula is confirmed rather than the table being the
      source. A third case uses n = 25, where B5 is NOT 0 (computed 0.5589347),
      which catches any implementation that hardcodes the lower limit to zero
      instead of computing it. One degenerate case (constant readings: every
      subgroup sd is 0, the limits collapse onto the center, and nothing is
      flagged). A test asserts that analyze_fridge() output for every demo
      fridge is IDENTICAL to what it was before the chart existed - same badge,
      same RPN, same Cpk, same Ppk, same units_at_risk, same violations rows -
      so the chart moved no number anyone can already read. Rscript
      demo/show_numbers.R still prints DEMO OK with the same fridge lines,
      Rscript -e "testthat::test_dir('tests')" passes, and the Fridge Detail
      page shows the new chart beside the range chart.
    result: "s-chart shipped on Fridge Detail. c4/B5/B6 computed from c4 =
      sqrt(2/(n-1))*exp(lgamma(n/2)-lgamma((n-1)/2)) in app/R/sd_constants.R,
      never looked up; n=4 gives c4=0.9213177, B6=2.0877494, B5=0 and n=25 gives
      B5=0.5589347, which catches any hardcoded zero lower limit. Test 1 only,
      same frozen baseline, strict comparisons, and display only - the s-chart
      never reaches the badge, RPN, units_at_risk or violations table. Suite
      754 passing 0 failing (was 533); all 11 SPEC section 4 known answers exact;
      demo/show_numbers.R still DEMO OK with identical fridge lines; every
      published number for all six demo fridges asserted unchanged against a
      pre-change snapshot; manifest checksums refreshed by hand for 5 files,
      platform still 4.5.2."


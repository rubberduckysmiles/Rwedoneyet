    result: "Every scenario claim is now taken from measurement, and the new section 'The two scenario sets' carries both per-fridge tables, the out-of-spec counts and the two checksums. Quoted: F06 in scenario_one_bad has mean 5.01, max 7.99, 193 readings above 6 C from 2026-10-05 18:15 (the old text said '~5-6 C'); F02 in scenario_one_good has mean 5.00, max 8.00, 195 above 6 C (the old text said 'drift low-temp'); F03 8 door flags/max 7.80; F04 5 generator flags/max 7.40; F05 144 readings stuck at 3.50 with sd 0.140 and nothing above 6 C; F01-F05 of the bad set max 4.02 or less. data/README.md also stops calling make_data.R the only generator, and make_scenarios.R's header no longer claims five distinct failure modes (F02 and F06 are both drift) and drops the dead F06 = mode_healthy line. Reproducibility quoted: Rscript data/make_scenarios.R in a scratch copy returned md5 0696b9ea91c2eedae93d65af736578f2 (bad) and edf520a1bed60149845cc47dd55cded (good) after LF normalization, identical to the committed files, so the edited script still writes the same bytes. testthat printed FAIL 0 | WARN 0 | SKIP 0 | PASS 854."


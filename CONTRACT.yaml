  - id: H-20
    title: "app/deployme.R publishes from a developer machine, or refuses clearly"
    points: "protects the deploy: the four-script contract needs a working local publish, and no secret may reach a file"
    status: done
    owner: "agent"
    started_at: "2026-10-19"
    owns: ["app/deployme.R", "app/README.md"]
    notes: >
      app/deployme.R is still stop("Posit Connect publish is a later task.")
      while testme.R, manifestme.R and workflow.R all work. GitHub Actions stays
      the main path; this is the fast first deploy and the fallback when Actions
      is red. Read CONNECT_SERVER and CONNECT_API_KEY from the environment only,
      via rsconnect::connectApiUser(), never from a file, never printed. Refuse
      with a clear message and a non-zero exit when either is missing, so a
      teammate without the publisher key gets a sentence and no half-deploy.
      Deploy the app folder with the committed manifest, matching the workflow's
      content name rubberduckysmiles-Rwedoneyet-shiny.
    definition_of_done: >
      With the two variables unset, Rscript app/deployme.R exits non-zero after
      naming the missing variable and attempts no deploy; app/deployme.R parses
      cleanly; and git grep -i "api_key" finds no literal key in it, only
      Sys.getenv. app/README.md's four-scripts table describes a real publish,
      not a stub.
    result: "app/deployme.R is a real publish. It refuses to run without credentials, reading CONNECT_SERVER and CONNECT_API_KEY only from the environment or the gitignored .env, then publishes app/ from the committed manifest to the workflow's own content name rubberduckysmiles-Rwedoneyet-shiny via addServer + connectApiUser + deployApp; the key is never printed and never written into the repo. Quoted: with both variables unset Rscript app/deployme.R exited 1 printing 'Error: Missing CONNECT_SERVER and CONNECT_API_KEY. ...'; with only CONNECT_SERVER set it exited 1 printing 'Error: Missing CONNECT_API_KEY.'; neither run reached rsconnect, so neither attempted a deploy. Rscript -e \"invisible(parse('app/deployme.R'))\" printed PARSED OK. git grep -in api_key -- app/deployme.R printed four hits and every one is the variable name - the comment, the name comparison, the needed vector and Sys.getenv - no literal key. app/README.md's four-scripts table now describes a real publish instead of a stub. deployme.R is not in the bundle (manifest still lists 16 files), so no checksum changed; testthat printed FAIL 0 | WARN 0 | SKIP 0 | PASS 854."

  - id: H-21
    title: "manifestme.R must not rewrite the platform off 4.5.2"
    points: "reproducibility: the committed manifest fingerprints a 4.5.2 machine and this laptop runs 4.6.1"
    status: done
    owner: "agent"
    started_at: "2026-10-19"
    owns: ["app/manifestme.R", "app/README.md"]
    notes: >
      app/manifest.json pins "platform": "4.5.2", the R version on the Connect
      server, and the published bundle must stay there. The only R on the
      author's machine is 4.6.1, and rsconnect::writeManifest() records the
      running R, so one careless Rscript app/manifestme.R would move the deploy
      to 4.6.1 and re-derive every package version. manifestme.R should read the
      committed platform, compare it with the running R version, and refuse
      before writing when they differ, printing both values and saying what to do.
    definition_of_done: >
      Rscript app/manifestme.R on this 4.6.1 machine refuses before writing, and
      the md5 of app/manifest.json is unchanged after the run; in a scratch copy
      the override path still writes a manifest, and app/README.md states the
      platform rule in one line.
    result: "manifestme.R now guards the platform. It reads the committed platform, compares it with this machine's R version and refuses before writing when they differ, so this 4.6.1 laptop cannot move the bundle off 4.5.2 by accident; ALLOW_PLATFORM_CHANGE=1 overrides deliberately. Quoted: Rscript app/manifestme.R printed 'Error: This machine runs R 4.6.1 but app/manifest.json pins platform 4.5.2, the R on the Connect server.' and exited 1, and app/manifest.json's md5 was 4242A54E58D103355A90F9B99EC54C2B before and after the run, so nothing was written. In a scratch copy of app/, with ALLOW_PLATFORM_CHANGE=1 it printed 'Wrote app/manifest.json at platform 4.6.1 (was 4.5.2)' and the copy's platform became 4.6.1; a second run with no override, pinned and running now both 4.6.1, printed 'Wrote app/manifest.json at platform 4.6.1 (was 4.6.1)' and exited 0. The real app/manifest.json still reports platform 4.5.2, 16 files, no checksum mismatch, and app/README.md's manifestme row states the rule and the override. testthat printed FAIL 0 | WARN 0 | SKIP 0 | PASS 854."

